<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp-desk</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("omp-desk.theme");
          if (t !== "dark" && t !== "midnight" && t !== "light" && t !== "system") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          var dark = t === "dark" || t === "midnight" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="brand">omp-desk</span>
        <div class="topbar-center">
          <label class="mode-toggle" title="Plan then Execute">
            <button type="button" id="mode-plan" class="mode-btn active" aria-pressed="true">Plan</button>
            <button type="button" id="mode-execute" class="mode-btn" aria-pressed="false">Execute</button>
          </label>
          <label class="model-picker">
            <span class="sr-only">Model</span>
            <select id="model-select" disabled title="Bound models from omp get_available_models">
              <option value="">omp default</option>
            </select>
          </label>
        </div>
        <div class="topbar-actions">
          <label class="theme-picker">
            <span class="theme-label">Theme</span>
            <select id="theme-select" title="Color theme" aria-label="Theme">
              <option value="dark">Dark</option>
              <option value="midnight">Midnight</option>
              <option value="light">Light</option>
              <option value="system">System</option>
            </select>
          </label>
          <button id="settings-toggle" type="button">Settings</button>
        </div>
      </header>

      <section id="settings-panel">
        <div class="row">
          <label>omp path</label>
          <input id="omp-path" type="text" spellcheck="false" />
        </div>
        <div class="row">
          <label>cwd</label>
          <input id="cwd" type="text" spellcheck="false" />
        </div>
        <div class="row">
          <label>spawn model</label>
          <input
            id="model"
            type="text"
            spellcheck="false"
            placeholder="empty = omit --model (omp config default)"
          />
        </div>
        <div class="row checks">
          <label><input id="no-session" type="checkbox" /> no-session</label>
          <label><input id="no-skills" type="checkbox" /> no-skills</label>
          <label><input id="no-rules" type="checkbox" /> no-rules</label>
        </div>
        <div class="row">
          <label>extra args</label>
          <input
            id="extra-args"
            type="text"
            spellcheck="false"
            placeholder="e.g. --plan-yolo (real omp flag)"
          />
        </div>
        <div class="row">
          <button id="apply-settings" type="button">Apply &amp; restart</button>
        </div>
      </section>

      <div id="studio">
        <aside id="pane-sessions" aria-label="Sessions">
          <div class="pane-title">Sessions</div>
          <div id="session-card" class="session-card">
            <div class="session-row">
              <div id="session-state" class="session-state" data-state="not started">not started</div>
              <div id="session-cwd" class="session-cwd" title=""></div>
            </div>
            <div id="session-meta" class="session-meta"></div>
          </div>
          <div class="pane-actions">
            <button id="new-session" type="button">New session</button>
            <button id="stop-session" type="button">Stop</button>
          </div>
        </aside>

        <section id="pane-chat" aria-label="Chat">
          <main id="transcript"></main>
          <footer id="composer-bar">
            <div class="composer-wrap">
              <div
                id="slash-palette"
                class="slash-palette hidden"
                role="listbox"
                aria-label="Slash commands"
                aria-hidden="true"
              ></div>
              <div class="composer-well">
                <textarea
                  id="composer"
                  placeholder="Ask omp… (/ for commands · Enter send · Shift+Enter newline)"
                  rows="3"
                  spellcheck="false"
                ></textarea>
                <div class="composer-actions">
                  <button id="send" type="button" disabled>Send</button>
                  <button id="abort" type="button" disabled>Abort</button>
                </div>
              </div>
            </div>
          </footer>
        </section>

        <aside id="pane-inspector" aria-label="Inspector">
          <div class="pane-title">Inspector</div>

          <div class="inspector-section">
            <div class="section-head">
              <span>Changes</span>
              <button id="clear-changes" type="button" class="linkish">Clear</button>
            </div>
            <ul id="changes-list" class="changes-list"></ul>
          </div>

          <div class="inspector-section grow">
            <div class="section-head">
              <span>Tasks</span>
              <button id="execute-plan" type="button" class="linkish" disabled>Confirm execute</button>
            </div>
            <ul id="tasks-list" class="tasks-list"></ul>
          </div>

          <div class="inspector-section run-section">
            <div class="section-head"><span>Run</span></div>
            <div class="run-actions">
              <button id="run-new-session" type="button">New session</button>
              <button id="run-abort" type="button" disabled>Abort</button>
            </div>
          </div>
        </aside>
      </div>

      <div id="status-bar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
