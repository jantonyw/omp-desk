name: Feature request
description: Suggest an improvement to the omp-desk shell
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing in the shell UI / process management?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep it scoped to omp-desk. Do not invent new omp RPC names.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This stays within UI + process management (shell), not rewriting omp
          required: true
        - label: Any RPC mentioned already exists in omp / this repo’s protocol types
          required: true
