[package]
name = "omp-desk"
version = "0.1.0"
description = "Desktop shell around the omp coding agent's RPC protocol"
edition = "2021"
license = "MIT"

[lib]
name = "omp_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "process", "sync", "rt", "macros", "time"] }

# Linux: WebKitGTK settings for hardware compositing (GPU is WebKit compositing, not wgpu).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

# Pin transitive deps that otherwise resolve to versions requiring rustc 1.88
# (the toolchain here is 1.85). These are MSRV-safe older releases that satisfy
# tauri 2.11's semver ranges.
time = "=0.3.36"
plist = "=1.7.0"
serde_with = "=3.9.0"
darling = "=0.20.10"
idna = "=1.0.3"
idna_adapter = "=1.0.0"
[profile.release]
codegen-units = 1
lto = true
strip = true
